<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Disha</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --accent-blue: #007aff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Glassmorphism Common Style */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Countdown Overlay Screen */
        #countdown-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .timer-box {
            font-size: 3rem;
            font-weight: 700;
            padding: 20px 40px;
            letter-spacing: 2px;
        }

        /* Top Drop Banner Screen */
        #banner-screen {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 8888;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            transition: top 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fabric-banner {
            background: linear-gradient(135deg, #ff2a5f, #ff758c);
            width: 80%;
            max-width: 600px;
            padding: 40px;
            border-radius: 0 0 30px 30px;
            box-shadow: 0 15px 30px rgba(255, 42, 95, 0.4);
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            border-bottom: 5px solid #fff;
        }

        /* Main Content Container */
        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 1s ease-in;
            padding-bottom: 50px;
        }

        /* Navigation Bar */
        nav {
            position: sticky;
            top: 15px;
            margin: 0 20px;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .menu-btn {
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #fff;
        }

        .nav-links {
            display: none;
            position: absolute;
            top: 60px;
            right: 20px;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            width: 150px;
        }

        .nav-links.active { display: flex; }
        .nav-links a { color: #fff; text-decoration: none; padding: 5px 10px; }

        /* Profile Section */
        .profile-card {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-blue);
        }

        .profile-name {
            font-size: 1.8rem;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .blue-badge {
            width: 20px;
            height: 20px;
            background: var(--accent-blue);
            color: #fff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Section Layouts */
        .section-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Billboard */
        .billboard {
            text-align: center;
            padding: 50px 20px;
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #00c6ff, #007aff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        /* Dynamic Grid Layout */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            padding: 15px;
            border-radius: 15px;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        /* Pin Board */
        .pin-board {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .pin-note {
            width: 200px;
            padding: 15px;
            background: rgba(255, 235, 59, 0.15);
            border: 1px solid rgba(255, 235, 59, 0.3);
            position: relative;
        }

        .pin-note::before {
            content: '📌';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Canvas Fireworks */
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9990;
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div id="countdown-screen">
        <h2>Website Unlocks In</h2>
        <br>
        <div class="glass timer-box" id="timer">Loading...</div>
    </div>

    <div id="banner-screen">
        <div class="fabric-banner">
            🎉 Happy Birthday Disha! 🎂
        </div>
    </div>

    <div id="main-content">
        <nav class="glass">
            <div style="font-weight: bold;">HBD DISHA</div>
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <div class="nav-links glass" id="navLinks">
                <a href="#home">Home</a>
                <a href="#gallery">Gallery</a>
                <a href="#stories">Golpo</a>
            </div>
        </nav>

        <div class="glass profile-card" id="home">
            <img src="https://via.placeholder.com/150" alt="Disha" class="profile-img">
            <div class="profile-name">
                Disha <span class="blue-badge">✓</span>
            </div>
            <p style="margin-top: 10px; opacity: 0.8;">Happy Birthday Disha!</p>
        </div>

        <div class="section-container glass billboard">
            ✨ HAPPY BIRTHDAY DISHA ✨
        </div>

        <div class="section-container">
            <h3 class="section-title">Special Memories</h3>
            <div class="grid-3" id="profileNotesContainer"></div>
        </div>

        <div class="section-container glass">
            <h3 class="section-title">Pin Board</h3>
            <div class="pin-board" id="pinBoardContainer"></div>
        </div>

        <div class="section-container" id="gallery">
            <h3 class="section-title">Gallery (30 Photos)</h3>
            <div class="grid-3" id="galleryContainer"></div>
        </div>

        <div class="section-container" id="stories">
            <h3 class="section-title">Golpo Collection</h3>
            <div id="storyContainer" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>
    </div>

    <script>
        // Set target date to Sept 6, 2026 03:10:00 AM
        const targetDate = new Date("September 6, 2026 03:10:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                clearInterval(timerInterval);
                triggerUnlockSequence();
            } else {
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);
                document.getElementById("timer").innerText = `${hours}h ${minutes}m ${seconds}s`;
            }
        }

        const timerInterval = setInterval(updateCountdown, 1000);
        updateCountdown();

        // Unlock Site Animations
        function triggerUnlockSequence() {
            document.getElementById("countdown-screen").style.display = "none";
            
            // Firework Blast Simulation
            explodeFireworks();

            // Drop Banner
            const banner = document.getElementById("banner-screen");
            banner.style.top = "0";

            setTimeout(() => {
                banner.style.top = "-100%";
                const mainContent = document.getElementById("main-content");
                mainContent.style.display = "block";
                setTimeout(() => mainContent.style.opacity = "1", 50);
            }, 3000);
        }

        // Generate Dynamic Elements
        // 1. Profile Notes (10 Items)
        const profileNotes = document.getElementById("profileNotesContainer");
        for (let i = 1; i <= 10; i++) {
            profileNotes.innerHTML += `
                <div class="glass card">
                    <img src="https://picsum.photos/300/200?random=${i}" alt="Photo">
                    <p style="font-size: 0.9rem;">Memory Note #${i}: Happy Birthday Disha! Hope your day is amazing.</p>
                </div>`;
        }

        // 2. Pin Board Notes
        const pinBoard = document.getElementById("pinBoardContainer");
        for (let i = 1; i <= 8; i++) {
            pinBoard.innerHTML += `
                <div class="glass pin-note">
                    <p>Sticky Note #${i}<br>Stay smiling always, Disha!</p>
                </div>`;
        }

        // 3. Gallery (30 Photos)
        const gallery = document.getElementById("galleryContainer");
        for (let i = 1; i <= 30; i++) {
            gallery.innerHTML += `
                <div class="glass card">
                    <img src="https://picsum.photos/300/200?random=${i+10}" alt="Gallery Photo">
                </div>`;
        }

        // 4. Golpo (20+ Stories)
        const stories = document.getElementById("storyContainer");
        for (let i = 1; i <= 20; i++) {
            stories.innerHTML += `
                <div class="glass card">
                    <h4>Golpo Chapter #${i}</h4>
                    <p style="margin-top: 5px; opacity: 0.8;">Ek choto golpo ar memory likha thakbe eikhane...</p>
                </div>`;
        }

        // Navigation Toggle
        function toggleMenu() {
            document.getElementById("navLinks").classList.toggle("active");
        }

        // Canvas Fireworks Effect Simple Logic
        function explodeFireworks() {
            const canvas = document.getElementById('fireworks');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 0.5) * 10,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    radius: Math.random() * 3 + 1
                });
            }

            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p) => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    p.x += p.dx;
                    p.y += p.dy;
                });
                requestAnimationFrame(animate);
            }
            animate();
            setTimeout(() => ctx.clearRect(0,0,canvas.width, canvas.height), 2500);
        }
    </script>
</body>
</html>
