<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Disha</title>
    
    <!-- Premium Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #ff4757;
            --accent: #ffa502;
            --bg-dark: #0a0a12;
            --card-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Unique Luxury Countdown Screen */
        #countdown-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #1a102f 0%, #08070c 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
        }

        .countdown-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #fff, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .countdown-sub {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        /* Modern Grid Typography Layout for Countdown */
        .timer-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 165, 2, 0.3);
            padding: 20px 25px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 165, 2, 0.1);
            min-width: 90px;
        }

        .time-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #ffa502;
            text-shadow: 0 0 15px rgba(255, 165, 2, 0.5);
            line-height: 1;
        }

        .time-label {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        /* Main Content UI */
        #main-wrapper {
            display: none;
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 90px 20px 50px 20px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .section-card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .profile-container {
            text-align: center;
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
            object-fit: cover;
            margin-bottom: 15px;
        }

        .profile-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #ff4757, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 600px) {
            .timer-grid {
                gap: 10px;
            }
            .time-box {
                padding: 15px 10px;
                min-width: 70px;
            }
            .time-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Unique Modern Countdown Overlay -->
    <div id="countdown-overlay">
        <h1 class="countdown-title">Birthday Surprise</h1>
        <p class="countdown-sub">Unlocking Automatically On 06-09-2026 | 07:45 AM</p>
        
        <div class="timer-grid">
            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Mins</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Secs</div>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <div id="main-wrapper">
        <div class="section-card profile-container">
            <img src="https://picsum.photos/300/300" alt="Disha" class="profile-avatar">
            <h1 class="profile-title">Happy Birthday Disha</h1>
        </div>
        <!-- অন্যান্য ৩ডি ব্যানার, কেক এবং মেসেজ সেকশনসমূহ -->
    </div>

    <script>
        // Target Date: 06-09-2026 07:45 AM
        const targetDate = new Date("2026-09-06T07:45:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance <= 0) {
                // 自動/Automatic Unlock Execution
                unlockWebsite();
            } else {
                const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = String(d).padStart(2, '0');
                document.getElementById("hours").innerText = String(h).padStart(2, '0');
                document.getElementById("minutes").innerText = String(m).padStart(2, '0');
                document.getElementById("seconds").innerText = String(s).padStart(2, '0');
            }
        }

        function unlockWebsite() {
            const overlay = document.getElementById("countdown-overlay");
            const mainContent = document.getElementById("main-wrapper");

            // Hide countdown and seamlessly display website
            overlay.style.opacity = "0";
            overlay.style.visibility = "hidden";

            setTimeout(() => {
                overlay.style.display = "none";
                mainContent.style.display = "block";
                setTimeout(() => {
                    mainContent.style.opacity = "1";
                }, 50);
            }, 1000);
        }

        // Run Timer
        const timerInterval = setInterval(() => {
            const now = new Date().getTime();
            if (targetDate - now <= 0) {
                clearInterval(timerInterval);
                unlockWebsite();
            } else {
                updateCountdown();
            }
        }, 1000);

        // Initial check
        updateCountdown();
    </script>
</body>
</html>
