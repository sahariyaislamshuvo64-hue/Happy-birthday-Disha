<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Day for DISHA | Ultra-Modern 3D Experience</title>
    
    <!-- iOS Glassmorphism & Core Styles -->
    <style>
        :root {
            --ios-glass: rgba(255, 255, 255, 0.08);
            --ios-border: rgba(255, 255, 255, 0.18);
            --ios-blur: blur(25px);
            --primary-accent: #00f3ff;
            --pink-accent: #ff007f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: #000003; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }

        /* Fullscreen WebGL Canvas */
        #webgl-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* --- 1. iOS ACTIVE COUNTDOWN LOCK SCREEN --- */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background: rgba(2, 2, 8, 0.95); backdrop-filter: blur(40px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }
        .dynamic-island {
            background: #000; border: 1px solid var(--ios-border); border-radius: 40px;
            padding: 15px 35px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: islandPulse 3s infinite ease-in-out; margin-bottom: 30px;
        }
        @keyframes islandPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .lock-timer { font-size: 2.8rem; font-weight: 800; font-family: monospace; color: var(--primary-accent); letter-spacing: 2px; }

        /* --- 2. MAIN WEBSITE CONTENT (POST-COUNTDOWN) --- */
        #main-site { display: none; opacity: 0; position: relative; z-index: 10; transition: opacity 1.5s ease; padding-bottom: 80px; }

        /* iOS Floating Glass Bar */
        .glass-nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
            background: var(--ios-glass); backdrop-filter: var(--ios-blur); border: 1px solid var(--ios-border);
            border-radius: 50px; padding: 10px 25px; display: flex; align-items: center; gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Stories Grid (10 Interactive Cards) */
        .section-container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .stories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
        .story-card {
            background: var(--ios-glass); backdrop-filter: var(--ios-blur); border: 1px solid var(--ios-border);
            border-radius: 24px; padding: 25px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative; overflow: hidden;
        }
        .story-card:hover { transform: translateY(-8px) scale(1.02); border-color: var(--primary-accent); }
        .story-card h4 { color: var(--primary-accent); margin-bottom: 10px; font-size: 1.2rem; }
        .story-card p { font-size: 0.95rem; line-height: 1.6; color: #d1d5db; }

        /* Social Share Section */
        .share-bar { display: flex; justify-content: center; gap: 15px; margin-top: 40px; }
        .share-btn {
            background: #1877f2; color: #fff; border: none; padding: 14px 28px; border-radius: 30px;
            font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 20px rgba(24, 119, 242, 0.4); transition: transform 0.3s ease;
        }
        .share-btn:hover { transform: scale(1.05); }
    </style>

    <!-- Essential Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- 1. WebGL 3D Background Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- 2. Countdown Lock Screen (04:25 06-09-2026-এর আগে অ্যাক্সেস লক রাখবে) -->
    <div id="lock-screen">
        <div class="dynamic-island">
            <span style="color: #ff007f;">🔒</span>
            <span style="font-size: 0.9rem; letter-spacing: 1px;">DISHA 3D EXPERIENCE</span>
        </div>
        <h2 style="margin-bottom: 15px; color: #a1a1aa;">ওয়েবসাইটে প্রবেশের সময় বাকি:</h2>
        <div class="lock-timer" id="countdown-timer">00:00:00:00</div>
        <p style="margin-top: 20px; color: #71717a; font-size: 0.85rem;">Target Time: 04:25 AM | 06 September, 2026</p>
    </div>

    <!-- 3. Main Modern Site Interface -->
    <div id="main-site">
        <!-- Floating iOS Glass Nav -->
        <div class="glass-nav">
            <span style="font-weight: 800; background: linear-gradient(45deg, var(--pink-accent), var(--primary-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">DISHA ❤️</span>
            <span style="font-size: 0.85rem; color: #a1a1aa;">Interactive Birthday Portal</span>
        </div>

        <div style="height: 100vh;"></div> <!-- Spacer for 3D Viewport -->

        <!-- Story & Memories Section (১০টি গল্প কার্ড) -->
        <div class="section-container">
            <h2 style="font-size: 2rem; margin-bottom: 10px; background: linear-gradient(90deg, #fff, var(--primary-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                📖 10 Special Moments & Stories
            </h2>
            <p style="color: #a1a1aa; margin-bottom: 20px;">জীবনের সুন্দর ১০টি অধ্যায় ও স্মৃতি নিচে সাজানো রয়েছে:</p>

            <div class="stories-grid" id="stories-grid">
                <!-- Stories JavaScript দিয়ে ডাইনামিকভাবে রেন্ডার হবে -->
            </div>

            <!-- Social Share Bar -->
            <div class="share-bar">
                <button class="share-btn" onclick="shareToFacebook()">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Facebook-এ শেয়ার করুন
                </button>
            </div>
        </div>
    </div>

    <!-- Background Music Track -->
    <audio id="bday-music" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3"></audio>

    <script>
        // --- REAL-TIME TIMER LOCK LOGIC ---
        const targetDate = new Date("2026-09-06T04:25:00").getTime();

        function updateLockTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff <= 0) {
                // সময় পূর্ণ হলে লক স্ক্রিন রিমুভ হবে
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('main-site').style.display = 'block';
                setTimeout(() => { document.getElementById('main-site').style.opacity = '1'; }, 50);
                initSmooth3DScene();
                document.getElementById('bday-music').play().catch(() => {});
            } else {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                document.getElementById('countdown-timer').innerText = 
                    `${String(days).padStart(2,'0')}:${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
            }
        }
        setInterval(updateLockTimer, 1000);
        updateLockTimer();

        // --- ULTRA-FAST 60FPS THREE.JS ENGINE ---
        let scene, camera, renderer, cakeBillboardGroup;

        function initSmooth3DScene() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000003, 0.001);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 100);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lighting
            const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
            const pLight = new THREE.PointLight(0x00f3ff, 2, 300);
            pLight.position.set(0, 20, 50);
            scene.add(ambLight, pLight);

            // 3D Billboard Group (যেখানে কেক কাটছে এমন থ্রিডি ভিজ্যুয়াল থাকবে)
            cakeBillboardGroup = new THREE.Group();
            
            // Billboard Frame
            const frameGeo = new THREE.BoxGeometry(60, 35, 2);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8, roughness: 0.2 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            cakeBillboardGroup.add(frame);

            // Animated Screen/Canvas Inside Billboard
            const screenCanvas = document.createElement('canvas');
            screenCanvas.width = 512; screenCanvas.height = 256;
            const ctx = screenCanvas.getContext('2d');
            const screenTexture = new THREE.CanvasTexture(screenCanvas);

            const screenGeo = new THREE.PlaneGeometry(56, 31);
            const screenMat = new THREE.MeshBasicMaterial({ map: screenTexture });
            const screenMesh = new THREE.Mesh(screenGeo, screenMat);
            screenMesh.position.z = 1.1;
            cakeBillboardGroup.add(screenMesh);

            cakeBillboardGroup.position.set(0, 5, 0);
            scene.add(cakeBillboardGroup);

            // Dynamic Canvas Animation inside Billboard Screen (Cake Cutting Visual)
            let particleAngle = 0;
            function drawBillboardContent() {
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, 512, 256);

                // Animated Cake Drawing
                ctx.fillStyle = '#ff007f';
                ctx.fillRect(206, 140, 100, 60);
                ctx.fillStyle = '#00f3ff';
                ctx.fillRect(226, 90, 60, 50);

                // Candle Flame Animation
                ctx.beginPath();
                ctx.arc(256, 75 + Math.sin(particleAngle * 5) * 3, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#ffcc00';
                ctx.fill();

                // Animated Text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("🎂 DISHA'S CAKE CUTTING 🎂", 256, 40);

                screenTexture.needsUpdate = true;
            }

            // Particle Field
            const starGeo = new THREE.BufferGeometry();
            const starCount = 3000;
            const posArray = new Float32Array(starCount * 3);
            for(let i=0; i<starCount*3; i++) posArray[i] = (Math.random() - 0.5) * 800;
            starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMesh = new THREE.Points(starGeo, new THREE.PointsMaterial({ size: 1, color: 0x00f3ff }));
            scene.add(starMesh);

            // Fast Smooth Render Loop
            let clock = new THREE.Clock();
            function renderLoop() {
                requestAnimationFrame(renderLoop);
                const delta = clock.getElapsedTime();

                particleAngle += 0.05;
                drawBillboardContent();

                cakeBillboardGroup.rotation.y = Math.sin(delta * 0.5) * 0.15;
                cakeBillboardGroup.rotation.x = Math.cos(delta * 0.3) * 0.05;
                starMesh.rotation.y = delta * 0.02;

                renderer.render(scene, camera);
            }
            renderLoop();

            // Fire Celebration Fireworks
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
        }

        // --- 10 STORIES DATA GENERATION ---
        const storyData = [
            { title: "১. প্রথম দেখা 🌟", desc: "তোমার সাথে প্রথম পরিচয়ের মুহূর্তটি ছিল জীবনের অন্যতম সেরা মুহূর্ত।" },
            { title: "২. সোনালী হাসি 😊", desc: "তোমার এক চিলতে হাসি পুরো পরিবেশকে আনন্দে ভরিয়ে তোলে।" },
            { title: "৩. সুন্দর স্বপ্নগুলো ☁️", desc: "তোমার সব চাওয়া ও স্বপ্নগুলো সত্যিতে রূপান্তরিত হোক।" },
            { title: "৪. অফুরন্ত প্রেরণা 💡", desc: "তোমার সততা এবং মানসিক শক্তি প্রতিদিন আমাকে অনুপ্রাণিত করে।" },
            { title: "৫. আড্ডার মুহূর্ত ☕", desc: "একসাথে কাটানো প্রতিটা গল্প ও আড্ডার মুহূর্ত অনেক মূল্যবান।" },
            { title: "৬. মায়াবী চোখ 👁️", desc: "তোমার চোখের সরলতা তোমার মনটাকে প্রকাশ করে।" },
            { title: "৭. বিশেষ মুহূর্ত 🎈", desc: "আজকের দিনটি তোমার জীবনে বারবার সুখে ভরা হয়ে ফিরে আসুক।" },
            { title: "৮. বিশ্বস্ত বন্ধু 🤝", desc: "যেকোনো পরিস্থিতিতে তোমার পাশে থাকার ইচ্ছা সব সময় থাকবে।" },
            { title: "৯. ভালোবাসার গল্প ❤️", desc: "শব্দ দিয়ে তোমার প্রতি ভালোলাগার অনুভূতি প্রকাশ করা অসম্ভব।" },
            { title: "১০. শুভ জন্মদিন দিশা 🎉", desc: "আজকের বিশেষ দিনে তোমার জীবন ভরে উঠুক অফুরন্ত ভালোবাসায়।" }
        ];

        const storiesContainer = document.getElementById('stories-grid');
        storyData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'story-card';
            card.innerHTML = `<h4>${item.title}</h4><p>${item.desc}</p>`;
            storiesContainer.appendChild(card);
        });

        // --- FACEBOOK SHARE INTEGRATION ---
        function shareToFacebook() {
            const currentUrl = encodeURIComponent(window.location.href);
            const shareUrl = `https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`;
            window.open(shareUrl, '_blank', 'width=600,height=400');
        }

        // Window Resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
