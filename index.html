<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Disha ❤️</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --ios-bg: #0b0c10;
            --ios-glass: rgba(255, 255, 255, 0.08);
            --ios-glass-border: rgba(255, 255, 255, 0.18);
            --accent-pink: #ff2a5f;
            --accent-purple: #a100ff;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--ios-bg);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 3D Canvas Background */
        #star-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* 1. COUNTDOWN LOCK OVERLAY */
        #countdown-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #090a0f 0%, #1a0b2e 100%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .timer-box {
            background: var(--ios-glass);
            backdrop-filter: blur(25px);
            border: 1px solid var(--ios-glass-border);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            max-width: 500px;
            width: 90%;
        }

        .timer-box h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--accent-pink);
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .time-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 5px;
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .time-card span {
            display: block;
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
        }

        .time-card label {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* 2. 3D INTRO BANNER */
        #intro-banner {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(30px);
            z-index: 9000;
            display: none;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .banner-3d {
            background: linear-gradient(135deg, rgba(255, 42, 95, 0.2), rgba(161, 0, 255, 0.2));
            border: 1px solid var(--ios-glass-border);
            padding: 50px;
            border-radius: 35px;
            text-align: center;
            transform: rotateX(20deg) rotateY(-10deg) scale(0.8);
            animation: bannerEntrance 1.5s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 40px 80px rgba(255, 42, 95, 0.3);
        }
